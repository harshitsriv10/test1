service:
  name: service_repo3
  identifier: service_repo3
  orgIdentifier: default
  projectIdentifier: test
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: m12
            type: HelmChart
            spec:
              store:
                type: OciHelmChart
                spec:
                  config:
                    type: ECR
                    spec:
                      connectorRef: ECRConnectorForAutomationTest
                      region: us-east-1
                      registryId: ""
                  basePath: /
              chartName: todolist
              subChartPath: ""
              chartVersion: <+input>
              helmVersion: V380
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
              optionalValuesYaml: false
    type: Kubernetes
